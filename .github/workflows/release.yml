name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-13
            artifact: webzen-mac
            files: |
              dist/*.dmg
          - platform: win
            os: windows-latest
            artifact: webzen-win
            files: |
              dist/*.exe
          - platform: linux
            os: ubuntu-latest
            artifact: webzen-linux
            files: |
              dist/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.platform }}
        run: npm run dist:${{ matrix.platform }}

      - name: Upload ${{ matrix.platform }} binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  source:
    name: source code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source archive
        run: git archive --format=tar.gz --prefix="webzen-${GITHUB_REF_NAME}/" -o "webzen-${GITHUB_REF_NAME}-source.tar.gz" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: webzen-source-code
          path: webzen-${{ github.ref_name }}-source.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs:
      - build
      - source
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: WebZen ${{ github.ref_name }}
          files: release-assets/*
          body: |
            WebZen desktop release.

            Includes Windows, macOS, Linux binaries and a source code tar.gz archive.
